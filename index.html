<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Підтвердження дії</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Consolas", "Monaco", "Courier New", monospace;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .terminal-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        .terminal-header {
            background: #21262d;
            padding: 10px 16px;
            border-bottom: 1px solid #30363d;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .dot-red { background: #ff5f56; }
        .dot-yellow { background: #ffbd2e; }
        .dot-green { background: #27c93f; }

        .terminal-title {
            font-size: 12px;
            color: #8b949e;
            margin-left: 10px;
        }

        .terminal-body {
            padding: 20px;
            font-size: 13px;
            line-height: 1.6;
        }

        .terminal-heading {
            font-size: 15px;
            font-weight: bold;
            color: #f0f6fc;
            margin-bottom: 12px;
        }

        .log-line {
            margin-bottom: 16px;
            color: #8b949e;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 24px;
        }

        .btn-terminal {
            flex: 1;
            padding: 12px;
            background: #21262d;
            border: 1px solid #30363d;
            color: #58a6ff;
            font-family: inherit;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            text-align: center;
            transition: background 0.2s, color 0.2s;
        }

        .btn-terminal:hover {
            background: #30363d;
            color: #79c0ff;
        }

        .btn-cancel {
            color: #8b949e;
        }

        .btn-cancel:hover {
            color: #c9d1d9;
        }
    </style>
</head>
<body>

    <div class="terminal-card">
        <div class="terminal-header">
            <div class="dot dot-red"></div>
            <div class="dot dot-yellow"></div>
            <div class="dot dot-green"></div>
            <span class="terminal-title">bash - confirmation.sh</span>
        </div>
        <div class="terminal-body">
            <div class="terminal-heading">Підтвердження дії</div>
            <div class="log-line">Запитуваний вміст знаходиться за межами цієї сторінки. Ви впевнені, що бажаєте продовжити та відкрити цей вміст?</div>

            <div class="buttons">
                <button class="btn-terminal btn-cancel" onclick="reload()">Скасувати</button>
                <button class="btn-terminal" onclick="nextPage()">Погодитися</button>
            </div>
        </div>
    </div>

    <script>
        function nextPage() {
            window.location.href = "info.html";
        }

        function reload() {
            window.location.reload();
        }
    </script>

</body>
</html>
